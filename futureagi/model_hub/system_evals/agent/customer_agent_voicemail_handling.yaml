eval_id: 206
name: customer_agent_voicemail_handling
description: Evaluates how an outbound voice agent handles reaching a voicemail box or answering machine - whether it detects
  the machine and stops its script, leaves one complete message or disconnects cleanly, leaves no sensitive information, and
  does not loop.
criteria: "You are evaluating how an outbound agent handles reaching a voicemail box or answering machine instead of a live\
  \ person.\n\n## Criteria\n\n1. Machine detection: The agent recognizes a recorded greeting or answering machine and stops\
  \ behaving as if a person is listening.\n   - Pass: Stops asking questions once the recorded greeting or beep makes clear\
  \ no one is answering.\n   - Fail: Works through its script, pausing for answers that never come.\n\n2. Correct action once\
  \ detected: The agent either leaves one complete message - who is calling, why, and how to respond - or disconnects cleanly.\n\
  \   - Pass: \"This is <agent> from <organization> about <reason>. You can reach us at <number>.\"\n   - Fail: \"Hi, just\
  \ calling to follow up - call us back,\" trailing off mid-sentence, or holding an open line in silence.\n\n3. Safe and clean\
  \ termination: The agent leaves no sensitive specifics on a machine anyone might hear, and ends the call without repeating\
  \ or restarting.\n   - Pass: \"It's about your recent enquiry - call us and we can confirm the details securely.\"\n   -\
  \ Fail: Reads out an account number or balance, or loops the message a second time.\n\n## Anti-bias Rules\n\n- If a live\
  \ person answers, this eval does not apply - return 'Passed', as there is no voicemail handling to assess.\n- A short exchange\
  \ before the line is clearly a machine is normal, and an immediate clean disconnect is valid where the deployment expects\
  \ no message to be left.\n- Transcripts render greetings and beeps inconsistently and often omit them; infer voicemail from\
  \ context rather than requiring an explicit marker, and do not penalize transcription noise.\n\n## Scoring\n\nReturn 'Passed'\
  \ if the agent recognizes the machine promptly, stops its interactive script, and either leaves one complete message or\
  \ disconnects cleanly, with no sensitive information disclosed and no repetition. Return 'Failed' if it runs its script\
  \ into a machine, never adapts, leaves an incomplete or duplicated message, discloses sensitive information, or hangs up\
  \ mid-message.\n\n## Inputs\n\n<conversation>{{conversation}}</conversation>"
eval_tags:
- Agents
- Conversation
- Voice
visible_ui: true
permissions:
  allow_edit: false
  allow_copy: true
choices:
- Passed
- Failed
output_type_normalized: pass_fail
pass_threshold: 0.5
config:
  required_keys:
  - conversation
  output: Pass/Fail
  eval_type_id: AgentEvaluator
  config: {}
  config_params_desc:
    conversation: The conversation to be evaluated
  param_modalities:
    conversation:
    - TEXT
    - AUDIO
    - JSON
    - LIST
    - NUMBER
    - BOOLEAN
    - INTEGER
    - FLOAT
    - ARRAY
    - DATETIME
