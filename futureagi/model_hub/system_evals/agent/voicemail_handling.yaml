eval_id: 207
name: voicemail_handling
description: Evaluates whether the agent responded correctly upon reaching a voicemail - hangs up cleanly or leaves a brief
  appropriate message per its prompt, and does not proceed as if speaking to a live customer.
criteria: 'You are evaluating whether the agent responded correctly upon reaching a voicemail.


  ## Criteria

  1. Correct behavior: The agent either hangs up cleanly or leaves a brief, appropriate message - consistent with the agent
  prompt''s instructions for voicemail handling.

  2. No live-call behavior: The agent does not proceed as if speaking to a live customer (e.g. asking questions, waiting for
  responses).


  ## Anti-bias Rules

  - If the agent prompt instructs hang up only, leaving a message is a FAIL and vice versa.

  - A brief pause before hanging up is NOT incorrect behavior.

  - Evaluate against what the agent prompt defines as correct voicemail handling.


  ## Scoring

  - Return PASS if call did not go to the VOICEMAIL and the agent handled the voicemail correctly per the agent prompt (hung
  up cleanly or left an appropriate message).

  - Return FAIL if the agent proceeded as if speaking to a live person, left a message when instructed to hang up, or hung
  up when instructed to leave a message.


  ## Input

  <agent_prompt>{{agent_prompt}}</agent_prompt>

  <audio_url>{{Conversation}}</audio_url>'
eval_tags:
- Agents
- Conversation
- Voice
visible_ui: true
